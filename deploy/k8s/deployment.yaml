apiVersion: apps/v1
kind: Deployment
metadata:
  name: parley
  labels:
    app: parley
spec:
  # LOAD-BEARING: Parley's realtime hub is in-process, enforced by a Postgres
  # advisory lock at boot. A second replica will refuse to start. Recreate
  # (not RollingUpdate) means a few seconds of downtime per deploy — the
  # client's reconnect banner makes that a non-event.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: parley
  template:
    metadata:
      labels:
        app: parley
    spec:
      # The old pod holds the boot advisory lock until it exits, and Recreate
      # waits for that. http.Server.Shutdown does not close hijacked WebSocket
      # connections, so give termination real room — a new pod that starts too
      # early dies with "advisory lock ... already held".
      terminationGracePeriodSeconds: 30
      containers:
        - name: parley
          # A published tag, not :latest. Rolling back onto an older image after
          # a migration ran makes Parley refuse to start (by design).
          image: ghcr.io/jacorbello/parley:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: parley
                  key: database-url
            - name: BASE_URL
              value: "https://parley.example.com" # the address users reach it at
            # An Ingress terminates the connection, so without this every
            # visitor arrives wearing the controller's address and the
            # room-code throttle counts the whole internet as one client:
            # eight wrong guesses would lock everybody out of that space.
            # Only correct while the Ingress *overwrites* X-Forwarded-For.
            # ingress-nginx does by default, but with use-forwarded-headers
            # it appends instead, and the leftmost value — the one read here
            # — is the caller's own again, throttle bypass and all. With an
            # ELB or CDN in front, check that before leaving this true.
            - name: TRUST_PROXY_HEADERS
              value: "true"
          # The first four are what the "restricted" Pod Security Standard
          # checks: it reads the manifest, never the image, so the distroless
          # nonroot USER does not satisfy runAsNonRoot on its own.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # Not a PSS control. Parley never writes to disk — the frontend and
            # the migrations are embedded, exports stream to the response.
            readOnlyRootFilesystem: true
          # Migrations run before the listener exists, so nothing answers on
          # 8080 during boot. Without this, liveness starts failing at t=0 and
          # kills the pod 30s in. 60s of slack covers today's migrations and the
          # database-connect retries, which give up at ~60s anyway — raise
          # failureThreshold if you ever add a migration that rewrites a table.
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          # Liveness never touches the database: a DB blip must not restart the
          # process and drop every WebSocket in the room.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          # No limits: nobody has measured Parley's steady-state footprint, and
          # a memory limit guessed too low turns a busy room into an OOMKill
          # that drops every WebSocket — the thing the liveness probe above is
          # careful not to do. Measure yours, then set limits == requests.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: parley
spec:
  selector:
    app: parley
  ports:
    - port: 80
      targetPort: 8080
# Parley ships no Postgres for Kubernetes — bring a managed database or an
# operator, then hand the Deployment its connection string:
#
#   kubectl create secret generic parley \
#     --from-literal=database-url='postgres://parley:secret@host:5432/parley'
#
# ---
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: parley
#   annotations:
#     # Parley pings every 25s; anything shorter than that cuts live boards.
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "75s"
#     nginx.ingress.kubernetes.io/proxy-send-timeout: "75s"
# spec:
#   rules:
#     - host: parley.example.com
#       http:
#         paths:
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: parley
#                 port:
#                   number: 80
#
# Terminating TLS here means BASE_URL must be the https:// address, exactly as
# users type it. Get it wrong and the session cookie is silently dropped.
