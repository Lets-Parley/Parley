# A plain manifest, kept for people who do not run Helm. If you do, the chart
# in deploy/charts/parley carries these same settings with the sharp edges
# guarded at render time:
#
#   helm install parley oci://ghcr.io/lets-parley/charts/parley \
#     --set database.existingSecret=parley --set baseURL=https://parley.example.com
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parley
  labels:
    app: parley
spec:
  # Parley supports more than one replica: fanout, presence and the passcode
  # throttle all go through Postgres, and migrations serialize behind an
  # advisory lock so pods that boot together are safe. One is the default here
  # and in the chart, so nothing doubles your pod count behind your back — raise
  # this for rollout headroom and a survivable node failure, and add a
  # PodDisruptionBudget when you do. The Helm chart does both for you.
  #
  # Every replica opens up to 10 pooled Postgres connections plus one for the
  # fanout listener, so size max_connections for replicas * 11 — 12 per pod
  # briefly at boot, while it holds the migration lock on its own connection.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: parley
  template:
    metadata:
      labels:
        app: parley
    spec:
      # http.Server.Shutdown does not close hijacked WebSocket connections, so
      # give termination real room: the old pod holds its presence rows and its
      # database connections until the process exits.
      terminationGracePeriodSeconds: 30
      # Ready for when you scale up: two replicas on one node is one node
      # failure away from none.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: parley
      containers:
        - name: parley
          # A published tag, not :latest. Rolling back onto an older image after
          # a migration ran makes Parley refuse to start (by design).
          image: ghcr.io/lets-parley/parley:0.4.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: parley
                  key: database-url
            - name: BASE_URL
              value: "https://parley.example.com" # the address users reach it at
            # Safe default: forwarded addresses are ignored. To enable them,
            # set this true and add TRUSTED_PROXY_CIDRS containing every
            # Ingress/load-balancer CIDR that can be an immediate or forwarded
            # proxy hop. Startup refuses true without that allowlist.
            - name: TRUST_PROXY_HEADERS
              value: "false"
            # Stamped on this pod's presence rows, so a row that outlives its
            # pod can be traced back to it. Optional: without it Parley uses a
            # random per-process id.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # The first four are what the "restricted" Pod Security Standard
          # checks: it reads the manifest, never the image, so the distroless
          # nonroot USER does not satisfy runAsNonRoot on its own.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # Not a PSS control. Parley never writes to disk — the frontend and
            # the migrations are embedded, exports stream to the response.
            readOnlyRootFilesystem: true
          # Migrations run before the listener exists, so nothing answers on
          # 8080 during boot. Without this, liveness starts failing at t=0 and
          # kills the pod 30s in. 60s of slack covers today's migrations and the
          # database-connect retries, which give up at ~60s anyway — raise
          # failureThreshold if you ever add a migration that rewrites a table.
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          # Liveness never touches the database: a DB blip must not restart the
          # process and drop every WebSocket in the room.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          # No limits: nobody has measured Parley's steady-state footprint, and
          # a memory limit guessed too low turns a busy room into an OOMKill
          # that drops every WebSocket — the thing the liveness probe above is
          # careful not to do. Measure yours, then set limits == requests.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: parley
spec:
  selector:
    app: parley
  ports:
    - port: 80
      targetPort: 8080
# Parley ships no Postgres for Kubernetes — bring a managed database or an
# operator, then hand the Deployment its connection string:
#
#   kubectl create secret generic parley \
#     --from-literal=database-url='postgres://parley:secret@host:5432/parley'
#
# ---
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: parley
#   annotations:
#     # Parley pings every 25s; anything shorter than that cuts live boards.
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "75s"
#     nginx.ingress.kubernetes.io/proxy-send-timeout: "75s"
# spec:
#   rules:
#     - host: parley.example.com
#       http:
#         paths:
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: parley
#                 port:
#                   number: 80
#
# Terminating TLS here means BASE_URL must be the https:// address, exactly as
# users type it. Get it wrong and the session cookie is silently dropped.
