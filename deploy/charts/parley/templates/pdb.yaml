{{- /*
Only when there is more than one replica to protect. A PodDisruptionBudget with
minAvailable: 1 in front of a single pod blocks every voluntary eviction, so a
`kubectl drain` for a node upgrade hangs forever waiting for a pod that can
never be moved. That is worse than having no budget at all.
*/ -}}
{{- if and (eq (include "parley.isTrue" .Values.podDisruptionBudget.enabled) "true") (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "parley.fullname" . }}
  labels:
    {{- include "parley.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "parley.selectorLabels" . | nindent 6 }}
{{- end }}
