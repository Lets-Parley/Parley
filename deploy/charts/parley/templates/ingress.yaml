{{- if eq (include "parley.isTrue" .Values.ingress.enabled) "true" }}
{{- if not (hasPrefix "https://" .Values.baseURL) }}
{{- if .Values.ingress.tls }}
{{- fail "ingress.tls is set but baseURL is not an https:// address. BASE_URL must be the address users actually type, or the session cookie is silently dropped." }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "parley.fullname" . }}
  labels:
    {{- include "parley.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "parley.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
