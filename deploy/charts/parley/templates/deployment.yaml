{{- $trustProxyHeaders := eq (include "parley.isTrue" .Values.trustProxyHeaders) "true" }}
{{- if and $trustProxyHeaders (not .Values.trustedProxyCIDRs) }}
{{- fail "trustProxyHeaders is true but trustedProxyCIDRs is empty. Parley refuses to start that way: trusting X-Forwarded-For from any source is the throttle bypass the setting exists to prevent. Set trustedProxyCIDRs to every Ingress/load-balancer CIDR that can be a proxy hop." }}
{{- end }}
{{- /*
  A default route in the allowlist trusts X-Forwarded-For from every address on
  the internet, which is the same hole as an empty list wearing a value. Refused
  specifically, and only these two: a /16 is a legitimate pod CIDR alongside the
  NetworkPolicy, and refusing it would break the only Kubernetes configuration
  that works. Parley refuses the same two at startup.
*/ -}}
{{- if $trustProxyHeaders }}
{{- range (splitList "," (toString .Values.trustedProxyCIDRs)) }}
{{- if has (trim .) (list "0.0.0.0/0" "::/0") }}
{{- fail (printf "trustedProxyCIDRs contains %s, a default route. That trusts a forwarded client address from every host on the internet — the throttle bypass trustProxyHeaders exists to prevent — and Parley refuses to start on it. List only the proxy hops; on Kubernetes that is your pod CIDR, together with networkPolicy.enabled=true." (trim .)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq .Values.auth.mode "oidc" }}
{{- /*
  auth.oidc.publicClient can arrive as a Go bool (--set / values.yaml) or as a
  string (--set-string, ArgoCD parameter overrides, Helmfile, CI templating
  that emits quoted YAML booleans). Go templates treat ANY non-empty string —
  including the string "false" — as truthy, so raw truthiness on this value
  would let `--set-string auth.oidc.publicClient=false` silently mean "true".
  Coerce explicitly: only the boolean true or the exact string "true" counts
  as public. Everything else (false, "false", "no", a typo like "True") falls
  through as not-public, which lands on the "neither declared" refusal below
  rather than silently becoming a secretless public client — a typo here must
  fail loudly, never fail open.
*/ -}}
{{- $public := eq (include "parley.isTrue" .Values.auth.oidc.publicClient) "true" }}
{{- if and $public .Values.auth.oidc.existingSecret }}
{{- fail "auth.oidc.publicClient is true but auth.oidc.existingSecret is also set. Those are two different client registrations and the chart will not guess: a public client has no secret, a confidential one has nothing to gain from PKCE alone. Set exactly one." }}
{{- end }}
{{- if not (or $public .Values.auth.oidc.existingSecret) }}
{{- fail "auth.mode is oidc but neither auth.oidc.existingSecret nor auth.oidc.publicClient is set. Choose one: set auth.oidc.existingSecret to the name of a Secret holding the client secret (never put the secret in values), or set auth.oidc.publicClient=true if the provider registration is a public client — Parley uses PKCE, so that works with no secret at all. Leaving both unset is not a public client, it is an unanswered question, so the chart refuses rather than quietly dropping the secret from a confidential-client deployment." }}
{{- end }}
{{- end }}
{{- include "parley.checkReplicas" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parley.fullname" . }}
  labels:
    {{- include "parley.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # RollingUpdate: nothing in Parley is single-instance any more, so a new pod
  # can come up beside the old one. maxUnavailable 0 keeps capacity through the
  # rollout; maxSurge 1 replaces one pod at a time so the database sees at most
  # one extra replica's worth of connections.
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "parley.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "parley.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "parley.serviceAccountName" . }}
      # Also set here, not just on the ServiceAccount: when both are present the
      # pod-level field wins, so leaving it off would let the token back in.
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # http.Server.Shutdown does not close hijacked WebSocket connections, so
      # give termination real room: the pod's presence rows and database
      # connections are only let go when the process exits.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: parley
          image: "{{ .Values.image.repository }}:{{ include "parley.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "parley.databaseSecret" . }}
                  key: {{ .Values.database.secretKey }}
            - name: BASE_URL
              value: {{ .Values.baseURL | quote }}
            - name: TRUST_PROXY_HEADERS
              value: {{ .Values.trustProxyHeaders | quote }}
            {{- if $trustProxyHeaders }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.trustedProxyCIDRs | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Stamped on this pod's presence rows. Not required — Parley falls
            # back to a random per-process id — but it makes a row that outlives
            # its pod traceable to the pod that wrote it.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: OIDC_ISSUER
              value: {{ required "auth.oidc.issuer is required when auth.mode is oidc" .Values.auth.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientID is required when auth.mode is oidc" .Values.auth.oidc.clientID | quote }}
            {{- if .Values.auth.oidc.existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: {{ .Values.auth.oidc.secretKey }}
            {{- end }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Nothing answers on 8080 until migrations finish, so liveness must not
          # start counting until the startup probe has passed.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          # Never touches the database: a DB blip must not restart the process
          # and drop every WebSocket in the room.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      # Spread replicas across nodes: two pods on one node is one node failure
      # away from being no pods. ScheduleAnyway by default, so a single-node
      # cluster still schedules rather than leaving pods Pending forever.
      topologySpreadConstraints:
        {{- range . }}
        - {{ toYaml . | nindent 10 | trim }}
          labelSelector:
            matchLabels:
              {{- include "parley.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
