# Parley is one Go binary and a Postgres database. The frontend is compiled into
# the binary, so this chart deploys a single Deployment and a Service — there is
# no second service and no Node runtime in production.

image:
  repository: ghcr.io/lets-parley/parley
  # Leave empty to track the chart's appVersion, which always names a published
  # release. Setting it explicitly is fine; setting it to a *moving* tag is not,
  # and the chart refuses to render if you try — see the note below.
  #
  # This guard is a convenience, not the safety net. A digest pin
  # (repository@sha256:...) that resolves to an older image sails straight
  # through it. The real protection is in Parley itself: rolling back onto an
  # image older than the migrations that have already run makes it refuse to
  # start, by design, rather than corrupt the schema.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Parley supports more than one replica. WebSocket fanout goes through Postgres
# LISTEN/NOTIFY, presence and the passcode throttle live in the database, and
# migrations serialize behind an advisory lock, so pods that boot together are
# safe.
#
# The default stays 1 so that upgrading the chart never silently doubles a
# running install's pod count — and its database connections with it. Opt into
# HA explicitly:
#
#     --set replicaCount=2
#
# This needs chart 0.4.1 or newer. Every published chart up to and including
# 0.3.0 fails at render time on replicaCount > 1, and the binaries they deploy
# take a boot-time advisory lock that makes the second pod exit.
#
# At 2 or more you also get a PodDisruptionBudget and the rollout is seamless;
# at 1 there is a brief reconnect while the pod is replaced. Set 0 to take
# Parley down for a maintenance window.
#
# Every replica opens its own pool of up to 10 Postgres connections plus one
# for the fanout listener, so size max_connections for replicaCount * 11 — 12
# per pod briefly at boot, while it holds the migration lock on a connection of
# its own.
replicaCount: 1

# maxUnavailable: 0 keeps full capacity through a rollout; maxSurge: 1 replaces
# one pod at a time so the database never sees a whole extra deployment's worth
# of connections at once.
#
# Known and accepted: during the rollout the surviving old pods are running
# against a schema the new pod has already migrated forward. Parley's migrations
# are additive, so the old pods keep working; an old pod that *restarts*
# mid-rollout starts fine too, because it only refuses a database ahead of it by
# a migration it does not know, which resolves the moment the rollout replaces
# it. Roll forward rather than back.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Keeps a voluntary disruption — a node drain, a cluster upgrade — from taking
# every replica at once. Rendered only when replicaCount is above 1: a budget in
# front of a single pod blocks every eviction and hangs `kubectl drain` forever.
# Set maxUnavailable instead of minAvailable if you prefer; it wins when set.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

# Two replicas on one node is one node failure away from no replicas — this
# only bites once you scale above one. The selector is filled in by the chart. ScheduleAnyway rather than DoNotSchedule
# so a single-node or two-node cluster still schedules instead of leaving pods
# Pending; tighten it to DoNotSchedule once you have nodes to spare.
#
# The chart also adds matchLabelKeys: [pod-template-hash] to every entry that
# does not set its own, so the skew is computed within one revision. Without it
# a rollout can satisfy the constraint by stacking the new pods on one node, and
# ScheduleAnyway never re-evaluates, so the install stays collapsed. Check with
# kubectl get pods -o wide after an upgrade — two replicas and a healthy PDB do
# not tell you they are on different nodes.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

database:
  # DATABASE_URL — Parley ships no Postgres — bring a managed database or an operator. Create
  # the secret yourself and name it here:
  #
  #   kubectl create secret generic parley \
  #     --from-literal=database-url='postgres://parley:secret@host:5432/parley'
  #
  # There is deliberately no default and no bundled Postgres subchart: a
  # chart-managed database looks production-ready and is not.
  existingSecret: ""
  secretKey: database-url

# BASE_URL — the address users reach Parley at, exactly as they type it. Get this wrong and
# the session cookie is silently dropped — if you terminate TLS at the Ingress,
# this must be the https:// address.
baseURL: https://parley.example.com

# AUTH_MODE:
#   open  — anyone with the link picks a name and sits down.
#   oidc  — sign-in through your identity provider.
auth:
  mode: open
  oidc:
    # OIDC_ISSUER — the provider's base address, the one serving
    # /.well-known/openid-configuration.
    issuer: ""
    # OIDC_CLIENT_ID — the registration's client id.
    clientID: ""
    # OIDC_CLIENT_SECRET is read from a secret you create; never set the
    # client secret in values.
    #
    # With auth.mode=oidc you must choose one of these two, and the chart
    # refuses to render if you choose neither: a values merge that drops
    # existingSecret would otherwise downgrade a confidential client to a
    # public one without saying so.
    #
    #   existingSecret — the name of a Secret holding the client secret, for a
    #     confidential-client registration.
    #   publicClient   — true when the provider registration is public and has
    #     no secret at all. Legitimate, not a shortcut: Parley runs the
    #     authorization code flow with PKCE, so the code is bound to the
    #     browser that started the sign-in without a shared secret. Keycloak,
    #     Zitadel and Entra register an app of this shape as public by default.
    #
    # Setting both is a contradiction and also fails the render.
    #
    # publicClient must be a real boolean (true/false), not a quoted string.
    # ArgoCD parameter overrides, Helmfile, and CI templating pipelines
    # commonly emit quoted booleans (e.g. "false") when values are passed
    # through as --set-string or a string-typed parameter; the chart coerces
    # those, but only the literal string "true" counts as true — a quoted
    # "false", "no", or a typo is treated as not-public, not silently public.
    existingSecret: ""
    publicClient: false
    secretKey: oidc-client-secret
    # OIDC_ORG_CLAIM — the id_token claim carrying the caller's groups, whose
    # values are matched exactly and case-sensitively against each org's
    # registered claim value. Empty leaves Parley's default, "groups".
    orgClaim: ""
    # PARLEY_DEFAULT_ORG_CLAIM — bootstrap only: points the built-in default
    # org at one of your provider's groups, so a fresh instance has something
    # for orgClaim to match.
    defaultOrgClaim: ""
    # PARLEY_BOOTSTRAP_ADMIN — bootstrap only: "issuer|subject" from the
    # id_token, granted admin of the default org at its first sign-in. It is
    # the pair rather than a user id because the account does not exist until
    # then. Without it nobody is an admin and nobody can create the first org.
    bootstrapAdmin: ""

# TRUST_PROXY_HEADERS. An Ingress terminates the connection, so without this every visitor arrives
# wearing the controller's address and the room-code throttle counts the whole
# internet as one client: eight wrong guesses would lock everybody out of that
# space.
#
# An appending proxy is fine. Parley walks X-Forwarded-For right-to-left and
# takes the first address that is not in trustedProxyCIDRs; it never reads the
# leftmost value. So ingress-nginx with use-forwarded-headers, an ELB, or a CDN
# that appends its own hop all resolve to the real caller. What decides whether
# this is safe is the trust list below, not the append: every network you list
# is a network whose members can name any client address they like.
trustProxyHeaders: false

# TRUSTED_PROXY_CIDRS — every CIDR that can be an immediate or forwarded proxy
# hop, comma-separated.
# Required whenever trustProxyHeaders is true: the app refuses to start on a
# trusted-proxy setting with no allowlist, because "trust the header from
# anyone" is exactly the bypass the setting exists to prevent. The chart fails
# the render rather than letting that reach a CrashLoopBackOff.
#
# On Kubernetes, read this before you set it. The immediate peer Parley sees is
# the ingress controller's *pod* IP, and pod IPs are reassigned on every
# reschedule — so the only value that keeps working is the pod CIDR itself
# (10.42.0.0/16 on k3s, 10.244.0.0/16 on kubeadm/flannel, whatever your CNI
# hands out). That network is client-reachable from every workload in the
# cluster: any pod can open a connection straight to Parley's Service, present
# its own X-Forwarded-For, and pick whatever client address it likes — which is
# the room-code throttle and the open-mode identity quota, bypassed.
#
# The pod CIDR is therefore only safe alongside something that stops other pods
# reaching the Service. Set networkPolicy.enabled=true below, or an equivalent
# (a service-mesh authorization policy, a dedicated node pool). The chart warns
# in NOTES.txt when proxy trust is on and the NetworkPolicy is off.
#
# Narrow your ingress controller's own forwarded-header trust as well — Traefik
# forwardedHeaders.trustedIPs, ingress-nginx proxy-real-ip-cidr. Otherwise the
# same forgery just moves one hop upstream and arrives with the controller's
# blessing.
#
# 0.0.0.0/0 and ::/0 (and the ::0/0 / 0::0/0 spellings) are refused outright at
# render time as a fast, common-case convenience — Helm has no IP parser, so
# this is a literal-string match, not a real CIDR comparison. The Go binary is
# the authoritative check: it parses every value and refuses ANY spelling of a
# default route (including 0000:0000::/0 and friends), so a spelling the chart
# doesn't recognize still fails, just later — at startup, as a
# CrashLoopBackOff — rather than at `helm template` time. A /16 is *not*
# refused — alongside the NetworkPolicy it is the configuration that works.
trustedProxyCIDRs: ""

# A NetworkPolicy that default-denies ingress to Parley's pods and lets only the
# ingress controller through. This is what makes a pod-CIDR trustedProxyCIDRs
# safe; see the note above for why that value is the only one Kubernetes leaves
# you.
#
# Off by default, and deliberately so. A NetworkPolicy in a cluster whose CNI
# does not enforce them silently does nothing at all, and defaulting it on would
# black-hole every request in a cluster where the controller does not match the
# selectors below.
#
# What it cannot cover, whatever you set here:
#
#   * hostNetwork pods. They use the node's address, not a pod IP, so a
#     namespaceSelector or podSelector never matches them.
#   * Node IPs that fall inside a trusted CIDR. Traffic sourced from a node —
#     kubelet probes, a hostNetwork ingress controller — arrives from the node
#     address, and if that address is inside trustedProxyCIDRs its forwarded
#     header is trusted no matter what this policy says.
networkPolicy:
  enabled: false
  # Which pods may reach Parley. Both selectors must match the same peer, so
  # this is "pods labelled X, in namespace Y" — not either alone.
  #
  # The defaults describe ingress-nginx in its own namespace. For Traefik as
  # shipped with k3s:
  #
  #     networkPolicy:
  #       ingressController:
  #         namespace: kube-system
  #         podSelector:
  #           app.kubernetes.io/name: traefik
  #
  # The namespace is matched on the kubernetes.io/metadata.name label, which the
  # API server sets on every namespace from 1.21 onwards.
  ingressController:
    namespace: ingress-nginx
    podSelector:
      app.kubernetes.io/name: ingress-nginx
  # Appended verbatim to spec.ingress, for anything else that legitimately
  # reaches the pod — a Prometheus scraper, a second controller, a mesh sidecar.
  # Each entry is a full NetworkPolicyIngressRule.
  #
  # WARNING: an entry with no `from` key allows ingress from ANY source on the
  # ports it lists — that is Kubernetes NetworkPolicy semantics, not a bug in
  # this chart. `extraIngress: [{}]` (or any rule missing `from`) silently
  # defeats the whole default-deny policy above. Always scope each entry with
  # a `from` of namespaceSelector/podSelector/ipBlock peers.
  extraIngress: []

# LOG_LEVEL — one of debug, info, warn, error. Anything else stops the process.
logLevel: info

# Environment variables appended verbatim to the container, for the settings
# this chart does not give a value of its own. Each entry is a full EnvVar, so
# a valueFrom works here too.
#
#     extraEnv:
#       - name: OIDC_SCOPES
#         value: "profile email groups"
#
# What you would reach for it for:
#
#   * OIDC_SCOPES — the scopes requested alongside openid, space-separated.
#     Providers that only issue the group claim on request need it.
#   * The abuse and resource limits, every one a positive integer:
#     IDENTITY_IP_HOURLY_LIMIT, IDENTITY_GLOBAL_HOURLY_LIMIT,
#     LINK_REDEMPTION_IP_HOURLY_LIMIT, SPACE_LIMIT_PER_IDENTITY,
#     SESSION_LIMIT_PER_SPACE, DECK_LIMIT_PER_SPACE, KUDO_LIMIT_PER_SPACE,
#     STORY_LIMIT_PER_SESSION and LINK_LIMIT_PER_SESSION. See the configuration reference for what each
#     one counts before you raise it.
#   * PLUGIN_SECRET_KEY — base64, exactly 32 bytes decoded, the key plugin
#     secrets are encrypted with. Unset means plugin secrets are unavailable
#     and a plugin asking for them fails to install; prefer a valueFrom over a
#     literal here.
#   * PLUGIN_EVENT_RETENTION — how long delivered plugin events are kept
#     before they are pruned, a Go duration. Default 168h.
#   * PLUGIN_DIR — directory plugin bundles are read from, as
#     "<name>-<version>.wasm". Unset means no plugin host runs at all and no
#     WebAssembly runtime is created; setting it is the decision to run plugin
#     code. Mount the bundles read-only.
#   * PLUGIN_CALL_TIMEOUT — how long one plugin call may run. Default 2s.
#   * PLUGIN_MEMORY_PAGES — memory cap per plugin instance in 64 KiB pages.
#     Default 256 (16 MiB).
#   * PLUGIN_MAX_CONCURRENT_CALLS — in-flight plugin calls across all installs.
#     Default 8.
#   * PLUGIN_MAX_CALLS_PER_PLUGIN — in-flight calls one install may have.
#     Default 2.
#   * PLUGIN_MODULE_CACHE_SIZE — how many compiled plugin modules stay
#     resident. Default 16.
#   * PARLEY_CONFIG_FILE — path to a file of KEY=value lines merged under the
#     environment. Rarely wanted in Kubernetes, where the environment is
#     already the interface.
#   * DATABASE_ALLOW_PLAINTEXT — accept a DATABASE_URL that may talk to
#     Postgres unencrypted. Boot refuses an sslmode that is absent, disable,
#     allow or prefer without it. Prefer putting
#     ?sslmode=verify-full&sslrootcert=... on the database-url secret over
#     setting this. PGSSLMODE and PGSSLROOTCERT are honoured as libpq
#     fallbacks when the connection string says nothing.
#
# PORT is deliberately not one of them. Probes and containerPort target 8080;
# the Service maps service.port (default 80) to that target. Setting PORT here
# leaves the probes on 8080 and fails readiness. service.port only changes the
# cluster-facing Service port, not the process listen port.
#
# DATABASE_URL, BASE_URL, LOG_LEVEL, AUTH_MODE, POD_NAME, the OIDC settings
# and the proxy-trust pair are set from the values above; setting one here as
# well means the container carries the name twice, and Kubernetes takes the
# last one, which is this list.
extraEnv: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations:
    # Parley pings every 25s; anything shorter than that cuts live boards.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75s"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75s"
  host: parley.example.com
  path: /
  pathType: Prefix
  # Parley speaks plain HTTP and has no certificate handling at all — TLS is
  # entirely the ingress controller's job. This list is passed through verbatim
  # to the Ingress spec.tls. With cert-manager, add the issuer annotation above
  # and name the secret for it to fill in:
  #
  #   annotations:
  #     cert-manager.io/cluster-issuer: letsencrypt-prod
  #     nginx.ingress.kubernetes.io/proxy-read-timeout: "75s"
  #     nginx.ingress.kubernetes.io/proxy-send-timeout: "75s"
  #   tls:
  #     - hosts: [parley.example.com]
  #       secretName: parley-tls
  #
  # Overriding annotations replaces this file's defaults rather than merging, so
  # carry the two timeout annotations across. baseURL must be the https:// form
  # whenever tls is set; the chart refuses to render otherwise.
  tls: []

# The first four are what the "restricted" Pod Security Standard checks: it
# reads the manifest, never the image, so the distroless nonroot USER does not
# satisfy runAsNonRoot on its own.
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
  # Not a PSS control. Parley never writes to disk — the frontend and the
  # migrations are embedded, exports stream to the response.
  readOnlyRootFilesystem: true

podSecurityContext: {}

# No limits by default: nobody has measured Parley's steady-state footprint, and
# a memory limit guessed too low turns a busy room into an OOMKill that drops
# every WebSocket — the thing the liveness probe is careful not to do. Measure
# yours, then set limits == requests.
resources:
  requests:
    cpu: 50m
    memory: 64Mi

probes:
  # Migrations run before the listener exists, so nothing answers on 8080 during
  # boot. Without this, liveness starts failing at t=0 and kills the pod 30s in.
  # 60s of slack covers today's migrations and the database-connect retries,
  # which give up at ~60s anyway — raise failureThreshold if you ever add a
  # migration that rewrites a table.
  startup:
    periodSeconds: 5
    failureThreshold: 12
  # Liveness never touches the database: a DB blip must not restart the process
  # and drop every WebSocket in the room.
  liveness:
    periodSeconds: 10
  readiness:
    periodSeconds: 5

# The old pod holds its database connections and its presence rows until it
# exits. http.Server.Shutdown does not close hijacked WebSocket connections, so
# give termination real room.
terminationGracePeriodSeconds: 30

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Parley talks to Postgres and nothing else — it makes no Kubernetes API
  # calls at all. Mounting a service account token would hand every pod a
  # credential it never uses, which is the first thing anything with a foothold
  # in the container goes looking for. Set on both the ServiceAccount and the
  # pod spec below, because the pod-level field is the one that wins.
  automount: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
