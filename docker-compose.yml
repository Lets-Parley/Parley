services:
  app:
    # Tagging vX.Y.Z publishes the image as X.Y.Z — the metadata action strips
    # the leading v. `docker compose pull` picks up a newer tag.
    image: ghcr.io/lets-parley/parley:0.10.0
    # build: .   # uncomment (and comment out image:) to build from source
    environment:
      DATABASE_URL: postgres://parley:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/parley
      # Boot refuses a plaintext Postgres connection. It is allowed here, and
      # only here, because app and db share this compose file's bridge network
      # on one host: nothing off the host can see that traffic. Any other
      # topology — a managed database, another node, a VPC — must drop this and
      # put ?sslmode=verify-full&sslrootcert=... on DATABASE_URL instead.
      DATABASE_ALLOW_PLAINTEXT: ${DATABASE_ALLOW_PLAINTEXT:-true}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Leave false while the port is published straight to clients. Set it to
      # true only once TRUSTED_PROXY_CIDRS lists the proxy hops Parley sees.
      # Otherwise forwarded headers are ignored. See README "Reverse proxy".
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      IDENTITY_IP_HOURLY_LIMIT: ${IDENTITY_IP_HOURLY_LIMIT:-10}
      IDENTITY_GLOBAL_HOURLY_LIMIT: ${IDENTITY_GLOBAL_HOURLY_LIMIT:-500}
      SPACE_LIMIT_PER_IDENTITY: ${SPACE_LIMIT_PER_IDENTITY:-50}
      SESSION_LIMIT_PER_SPACE: ${SESSION_LIMIT_PER_SPACE:-500}
      STORY_LIMIT_PER_SESSION: ${STORY_LIMIT_PER_SESSION:-500}
      LINK_LIMIT_PER_SESSION: ${LINK_LIMIT_PER_SESSION:-20}
      LINK_REDEMPTION_IP_HOURLY_LIMIT: ${LINK_REDEMPTION_IP_HOURLY_LIMIT:-50}
    ports:
      # Bound to localhost by default. To reach it from other machines, change to
      # "0.0.0.0:8080:8080" AND set BASE_URL to the address teammates will use.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Mirrors deploy/k8s/deployment.yaml's securityContext. Parley never
    # writes to disk itself — the frontend and migrations are embedded and
    # exports stream to the response — so read_only needs no tmpfs mount.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # docker's json-file driver is unbounded by default; cap it so a busy
    # single-server host doesn't fill its disk with container logs. Podman
    # uses journald by default instead, where rotation is controlled by
    # journald.conf's SystemMaxUse, not these options — see
    # docs/operations/observability.mdx.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # Pinned major version: an unpinned image upgraded across a Postgres major
    # release leaves the data directory unreadable. See README "Upgrading".
    #
    # Digest-pinned rather than left on the moving `16-alpine` tag, so
    # `docker compose pull` cannot silently swap in a new image between one
    # `up` and the next. Re-resolve deliberately (this is the current
    # multi-arch index digest, not one platform's manifest digest):
    #
    #     podman run --rm quay.io/skopeo/stable inspect \
    #       docker://docker.io/library/postgres:16-alpine
    #
    # then update both the digest below and this comment's date.
    # Resolved 2026-09-04.
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: parley
      POSTGRES_DB: parley
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - parley-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parley -d parley"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    cap_drop: [ALL]
    # The official postgres entrypoint starts as root, chowns PGDATA and the
    # socket directory, then drops to the postgres user via gosu — dropping
    # ALL with no cap_add makes that chown/setuid fail and the container exits
    # immediately (verified: cap_drop: [ALL] alone fails "chmod: Operation
    # not permitted" / "failed switching to 'postgres'"). These four are the
    # minimum that let the entrypoint finish that handoff.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    # read_only: true is possible here too, but Postgres needs writable /tmp,
    # /var/run/postgresql (its unix socket) and /var/run for the entrypoint's
    # PID/lock files, on top of the already-writable data volume. Left off by
    # default rather than shipping an unverified tmpfs list for every distro
    # this image runs on; uncomment and add the tmpfs mounts once you've
    # confirmed them against the specific postgres:16-alpine build in use:
    # read_only: true
    # tmpfs:
    #   - /tmp
    #   - /var/run/postgresql
    #   - /var/run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  parley-data:
