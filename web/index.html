<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon-16.svg" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Parley — self-hosted planning poker and standups</title>
    <!-- Parley links are pasted into a chat client, which is exactly the
         surface that renders a preview card — and it rendered a bare link.
         Nothing here claims anything the product cannot show. -->
    <meta
      name="description"
      content="Planning poker, daily standups and kudos for a team that already knows each other. Self-hosted; in open mode, name a space, share the link, start a round."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Parley — planning poker and standups at a table your team keeps" />
    <meta
      property="og:description"
      content="Name a space, share the link, start a round. One Go binary and Postgres. No seat counts; no account needed in open mode."
    />
    <meta name="twitter:title" content="Parley — planning poker and standups at a table your team keeps" />
    <meta
      name="twitter:description"
      content="Name a space, share the link, start a round. One Go binary and Postgres. No seat counts; no account needed in open mode."
    />
    <!-- The server replaces this with the share URL, canonical link, share
         image and a large-image card from BASE_URL. When BASE_URL was not set
         it becomes a text-only summary card, since a share image needs an
         absolute address. -->
    <!--parley:share-url-->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E9E7E1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1726" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
