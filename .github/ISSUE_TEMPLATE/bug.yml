name: Bug report
description: Report a reproducible problem in Parley
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Parley. Do not include secrets, room codes, session cookies, personal data, or vulnerability details. Report security issues through the private link on the issue chooser.
  - type: input
    id: version
    attributes:
      label: Parley version
      description: Use an exact release tag or commit SHA.
      placeholder: v0.2.1
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Kubernetes
        - Binary from source
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest repeatable sequence.
      placeholder: |
        1. Create or join ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets, room codes, tokens, and personal information first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing Issues and Discussions for this problem.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
