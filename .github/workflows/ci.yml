name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -p 1 -race ./...
        env:
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test

  # The literal first-run path: the image boots against an EMPTY database and
  # serves a usable page.
  first-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t parley:smoke .
      - run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_USER=parley -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=parley \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U parley && break; sleep 1
          done
          docker run -d --name app --network smoke -p 8080:8080 \
            -e DATABASE_URL=postgres://parley:smoke@db:5432/parley \
            parley:smoke
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/readyz && break; sleep 1
          done
          curl -fs http://127.0.0.1:8080/readyz
          curl -fs http://127.0.0.1:8080/ | grep -qi '<div id="root">'

  # A chart that renders is not a chart that works. The default values render
  # almost nothing — ingress is off, the database secret has no default — so
  # linting alone would prove only that the YAML parses. Each case below asserts
  # which side of the line it must land on.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/charts/parley --set database.existingSecret=parley

      # Every conditional template at once, so a broken branch cannot hide
      # behind being disabled by default.
      - name: renders with every feature enabled
        run: |
          helm template parley deploy/charts/parley \
            --set database.existingSecret=parley \
            --set ingress.enabled=true \
            --set 'ingress.tls[0].hosts[0]=parley.example.com' \
            --set 'ingress.tls[0].secretName=parley-tls' \
            --set trustProxyHeaders=true > /tmp/all.yaml
          for kind in Deployment Service ServiceAccount Ingress; do
            grep -q "^kind: $kind$" /tmp/all.yaml || { echo "missing $kind"; exit 1; }
          done

      # The guards. Each of these MUST fail to render; a guard that never fires
      # in CI is a guard nobody has tested.
      - name: refuses a missing database secret
        run: |
          ! helm template parley deploy/charts/parley 2>/dev/null
      - name: refuses a moving image tag
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set image.tag=latest 2>/dev/null
      - name: refuses a second replica
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set replicaCount=2 2>/dev/null
      - name: refuses oidc without a client secret
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set auth.mode=oidc \
            --set auth.oidc.issuer=https://idp.example.com \
            --set auth.oidc.clientID=parley 2>/dev/null
      # A guard that only catches the exact string it was written against is not
      # a guard. These are the shapes that walked through the first version.
      - name: refuses a moving tag whatever the casing or padding
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set image.tag=LATEST 2>/dev/null
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set image.tag=Main 2>/dev/null
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set-string 'image.tag=latest ' 2>/dev/null
      - name: refuses a fractional replica count but allows zero
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set replicaCount=1.5 2>/dev/null
          # Scaling to zero is a legitimate way to take Parley down for a
          # database migration window, so it must still render.
          helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set replicaCount=0 >/dev/null
      - name: mounts no service account token
        run: |
          helm template parley deploy/charts/parley \
            --set database.existingSecret=x > /tmp/sa.yaml
          # Twice: once on the ServiceAccount, once on the pod spec. The
          # pod-level field is the one that wins, so one hit is not enough.
          test "$(grep -c 'automountServiceAccountToken: false' /tmp/sa.yaml)" = 2

      - name: refuses ingress TLS with an http baseURL
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set ingress.enabled=true \
            --set 'ingress.tls[0].secretName=t' \
            --set baseURL=http://parley.example.com 2>/dev/null

      # The chart and the hand-written manifest must not drift apart on the
      # settings that are load-bearing for security and for staying up.
      - name: matches deploy/k8s/deployment.yaml on the settings that matter
        run: |
          helm template parley deploy/charts/parley \
            --set database.existingSecret=parley --set image.tag=0.2.1 > /tmp/def.yaml
          for want in 'type: Recreate' 'terminationGracePeriodSeconds: 30' \
                      'runAsNonRoot: true' 'allowPrivilegeEscalation: false' \
                      'readOnlyRootFilesystem: true' 'failureThreshold: 12' \
                      'path: /healthz' 'path: /readyz' 'cpu: 50m' 'memory: 64Mi'; do
            grep -q "$want" /tmp/def.yaml || { echo "chart lost: $want"; exit 1; }
          done
