name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded frontend
        working-directory: web
        run: npm ci && npm test && npm run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Database-test opt-out must be unset
        run: test -z "${PARLEY_SKIP_DB_TESTS:-}"
      - name: Test with race detector
        run: |
          set -o pipefail
          go test -json -p 1 -race ./... | tee test-output.json | jq -j 'select(.Action=="output") | .Output'
        env:
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      - name: Reject skipped tests
        run: |
          skipped=$(jq -rs '
            [.[] | select(.Action=="output" and .Test == null and (.Output | test("no test files"))) | .Package] as $empty
            | .[] | select(.Action=="skip")
            | select(.Test != null or (.Package as $p | $empty | index($p) | not))
            | .Package + (if .Test then "." + .Test else " (whole package)" end)
          ' test-output.json)
          test -z "$skipped" || { echo "$skipped" >&2; exit 1; }
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  site:
    name: site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dco:
    name: dco
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Test DCO checker
        run: scripts/tests/check-dco-test.sh
      - name: Test release workflow policy
        run: scripts/tests/release-workflow-test.sh

  docker:
    name: docker build and smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --pull --tag parley:ci .
      - name: Smoke test first run
        run: |
          set -eu
          trap 'docker rm -f parley-ci-app parley-ci-db >/dev/null 2>&1 || true; docker network rm parley-ci >/dev/null 2>&1 || true' EXIT
          docker network create parley-ci
          docker run -d --name parley-ci-db --network parley-ci \
            -e POSTGRES_USER=parley -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=parley \
            postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          for i in $(seq 1 30); do
            docker exec parley-ci-db pg_isready -U parley && break
            sleep 1
          done
          docker run -d --name parley-ci-app --network parley-ci -p 8080:8080 \
            -e DATABASE_URL=postgres://parley:smoke@parley-ci-db:5432/parley parley:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<div id="root">'
      - name: Export image
        run: docker save parley:ci | gzip > parley-ci.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parley-ci-image
          path: parley-ci.tar.gz
          retention-days: 1
          if-no-files-found: error

  container-scan:
    name: container scan
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: parley-ci-image
      - name: Load image
        run: gunzip --stdout parley-ci.tar.gz | docker load
      - name: Scan image
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: parley:ci
          fail-build: true
          severity-cutoff: high
          output-format: sarif
      - name: Upload scan results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  chart:
    name: helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint and render supported configurations
        run: |
          set -eu
          helm version
          helm lint deploy/charts/parley --set database.existingSecret=parley
          helm template parley deploy/charts/parley \
            --set database.existingSecret=parley \
            --set ingress.enabled=true \
            --set ingress.host=parley.example.com \
            --set oidc.enabled=true \
            --set oidc.issuerURL=https://id.example.com \
            --set oidc.clientID=parley \
            --set oidc.existingSecret=parley-oidc >/tmp/parley-chart.yaml
          grep -q 'runAsNonRoot: true' /tmp/parley-chart.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/parley-chart.yaml
      - name: Reject invalid security values
        run: |
          ! helm template parley deploy/charts/parley --set database.existingSecret=parley --set replicaCount=0
          ! helm template parley deploy/charts/parley --set database.existingSecret=parley --set service.port=0

  gate:
    name: required / gate
    if: always()
    needs: [go, web, site, dependency-review, dco, docker, container-scan, chart]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        run: |
          test "${{ needs.go.result }}" = success
          test "${{ needs.web.result }}" = success
          test "${{ needs.site.result }}" = success
          test "${{ needs.dependency-review.result }}" = success
          test "${{ needs.dco.result }}" = success
          test "${{ needs.docker.result }}" = success
          test "${{ needs.container-scan.result }}" = success
          test "${{ needs.chart.result }}" = success
