name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded frontend
        working-directory: web
        run: npm ci && npm test && npm run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Database-test opt-out must be unset
        run: test -z "${PARLEY_SKIP_DB_TESTS:-}"
      - name: Test with race detector
        run: |
          set -o pipefail
          go test -json -p 1 -race ./... | tee test-output.json | jq -j 'select(.Action=="output") | .Output'
        env:
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      - name: Reject skipped tests
        run: |
          skipped=$(jq -rs '
            [.[] | select(.Action=="output" and .Test == null and (.Output | test("no test files"))) | .Package] as $empty
            | .[] | select(.Action=="skip")
            | select(.Test != null or (.Package as $p | $empty | index($p) | not))
            | .Package + (if .Test then "." + .Test else " (whole package)" end)
          ' test-output.json)
          test -z "$skipped" || { echo "$skipped" >&2; exit 1; }
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  site:
    name: site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dco:
    name: dco
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Test DCO checker
        run: scripts/tests/check-dco-test.sh
      - name: Test release workflow policy
        run: scripts/tests/release-workflow-test.sh

  docker:
    name: docker build and smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --pull --build-arg VERSION=ci-test --tag parley:ci .
      - name: Smoke test first run
        run: |
          set -eu
          trap 'docker rm -f parley-ci-app parley-ci-db >/dev/null 2>&1 || true; docker network rm parley-ci >/dev/null 2>&1 || true' EXIT
          docker network create parley-ci
          docker run -d --name parley-ci-db --network parley-ci \
            -e POSTGRES_USER=parley -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=parley \
            postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          for i in $(seq 1 30); do
            docker exec parley-ci-db pg_isready -U parley && break
            sleep 1
          done
          docker run -d --name parley-ci-app --network parley-ci -p 8080:8080 \
            -e DATABASE_URL=postgres://parley:smoke@parley-ci-db:5432/parley parley:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<div id="root">'
          # The released image must report the version it was built from. A
          # missing --build-arg leaves the Dockerfile default ("dev") in the
          # binary, which is exactly how a published release shipped unstamped.
          #
          # Coverage note: this build uses plain `docker build`, so it proves
          # the Dockerfile's ARG->ldflag contract and the /version endpoint.
          # It does NOT exercise docker/build-push-action's own build-args
          # passthrough (buildx, multi-platform, OCI export) used by the
          # release workflow -- see the buildx-arg-passthrough job below for
          # that.
          reported=$(curl -fsS http://127.0.0.1:8080/version | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ "$reported" != "ci-test" ]; then
            echo "expected /version to report ci-test, got: ${reported:-<unparsable>}" >&2
            curl -fsS http://127.0.0.1:8080/version >&2 || true
            exit 1
          fi
      - name: Export image
        run: docker save parley:ci | gzip > parley-ci.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parley-ci-image
          path: parley-ci.tar.gz
          retention-days: 1
          if-no-files-found: error

  buildx-arg-passthrough:
    name: build-push-action arg passthrough
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The docker job above proves the Dockerfile's ARG->ldflag contract via
      # plain `docker build`. The release workflow never calls `docker build`
      # directly -- it goes through docker/build-push-action (buildx,
      # multi-platform, OCI export), and that action's own build-args
      # passthrough was exactly what broke in the incident this PR fixes.
      # Nothing exercised it until a tag was cut. This job closes that gap
      # cheaply: single-platform, loaded straight into the local daemon, and
      # checked with the binary's own `-version` flag so it needs no
      # database or running server.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build via build-push-action with the release build-arg
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: parley:buildx-arg-check
          build-args: |
            VERSION=buildx-arg-check
      - name: Assert the build-arg reached the binary
        run: |
          set -eu
          reported=$(docker run --rm parley:buildx-arg-check -version)
          if [ "$reported" != "buildx-arg-check" ]; then
            echo "expected -version to report buildx-arg-check, got: ${reported:-<empty>}" >&2
            exit 1
          fi

  container-scan:
    name: container scan
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: parley-ci-image
      - name: Load image
        run: gunzip --stdout parley-ci.tar.gz | docker load
      - name: Scan image
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: parley:ci
          fail-build: true
          severity-cutoff: high
          output-format: sarif
      - name: Upload scan results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  chart:
    name: helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the chart
        run: |
          set -eu
          helm version
          helm lint deploy/charts/parley --set database.existingSecret=parley
      - name: renders the hardened pod spec
        run: |
          set -eu
          helm template parley deploy/charts/parley \
            --set database.existingSecret=parley > /tmp/parley-chart.yaml
          grep -q 'runAsNonRoot: true' /tmp/parley-chart.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/parley-chart.yaml

      # Every conditional template at once, so a broken branch cannot hide
      # behind being disabled by default. replicaCount=2 is part of that: the
      # PodDisruptionBudget is deliberately not rendered at the default of 1.
      - name: renders with every feature enabled
        run: |
          helm template parley deploy/charts/parley \
            --set database.existingSecret=parley \
            --set replicaCount=2 \
            --set ingress.enabled=true \
            --set 'ingress.tls[0].hosts[0]=parley.example.com' \
            --set 'ingress.tls[0].secretName=parley-tls' \
            --set trustProxyHeaders=true \
            --set trustedProxyCIDRs=10.0.0.0/8 > /tmp/all.yaml
          for kind in Deployment Service ServiceAccount Ingress PodDisruptionBudget; do
            grep -q "^kind: $kind$" /tmp/all.yaml || { echo "missing $kind"; exit 1; }
          done

      # The guards. Each of these MUST fail to render; a guard that never fires
      # in CI is a guard nobody has tested.
      - name: refuses a missing database secret
        run: |
          ! helm template parley deploy/charts/parley 2>/dev/null
      - name: refuses a moving image tag
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set image.tag=latest 2>/dev/null
      # Parley is multi-replica now, so this must RENDER. It used to be a
      # negative test; if it ever fails again the boot lock has come back.
      #
      # The default stays 1 either way: upgrading the chart must not silently
      # double an existing install's pods and database connections. HA is
      # opt-in, and that is what the second render below is.
      - name: defaults to one replica and renders a second on request
        run: |
          helm template parley deploy/charts/parley \
            --set database.existingSecret=x > /tmp/one-default.yaml
          grep -q 'replicas: 1' /tmp/one-default.yaml \
            || { echo "the chart no longer defaults to one replica"; exit 1; }
          helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set replicaCount=2 > /tmp/two.yaml
          grep -q 'replicas: 2' /tmp/two.yaml
          grep -q '^kind: PodDisruptionBudget$' /tmp/two.yaml
      - name: refuses oidc without a client secret
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set auth.mode=oidc \
            --set auth.oidc.issuer=https://idp.example.com \
            --set auth.oidc.clientID=parley 2>/dev/null
      # A guard that only catches the exact string it was written against is not
      # a guard. These are the shapes that walked through the first version.
      - name: refuses a moving tag whatever the casing or padding
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set image.tag=LATEST 2>/dev/null
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set image.tag=Main 2>/dev/null
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set-string 'image.tag=latest ' 2>/dev/null
      # The tag lands inside a double-quoted YAML string in the pod spec, so a
      # tag carrying a quote and a newline could close that string and append
      # its own container fields.
      - name: refuses a tag that would inject into the pod spec
        run: |
          printf 'image:\n  tag: |-\n    1.0"\n            command: ["cat","/etc/shadow"]\n            x: "y\n' > /tmp/inject.yaml
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x -f /tmp/inject.yaml 2>/dev/null
          # And the tags people actually use must keep working.
          for t in 0.2.1 v0.2.1 0.2.1-rc1 main-abc1234 sha-abc123 latest-stable; do
            helm template parley deploy/charts/parley \
              --set database.existingSecret=x --set-string "image.tag=$t" >/dev/null \
              || { echo "falsely rejected legitimate tag: $t"; exit 1; }
          done

      - name: refuses a fractional replica count but allows zero
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set replicaCount=1.5 2>/dev/null
          # Scaling to zero is a legitimate way to take Parley down for a
          # database migration window, so it must still render.
          helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set replicaCount=0 >/dev/null

      # A PodDisruptionBudget in front of a single pod blocks every voluntary
      # eviction and hangs `kubectl drain` forever, so it must not render below
      # two replicas — including at zero, where there is nothing to protect.
      - name: writes no disruption budget for a single replica
        run: |
          for n in 0 1; do
            helm template parley deploy/charts/parley \
              --set database.existingSecret=x --set replicaCount=$n > /tmp/one.yaml
            ! grep -q 'kind: PodDisruptionBudget' /tmp/one.yaml \
              || { echo "rendered a PDB at replicaCount=$n"; exit 1; }
          done

      # A rollout that takes capacity away, or replicas that all land on one
      # node, are the two ways multi-replica quietly fails to buy anything.
      - name: rolls without losing capacity and spreads across nodes
        run: |
          helm template parley deploy/charts/parley \
            --set database.existingSecret=x > /tmp/ha.yaml
          grep -q 'type: RollingUpdate' /tmp/ha.yaml
          grep -q 'maxSurge: 1' /tmp/ha.yaml
          grep -q 'maxUnavailable: 0' /tmp/ha.yaml
          grep -q 'topologyKey: kubernetes.io/hostname' /tmp/ha.yaml
          # The spread constraint needs the selector the chart fills in; a
          # constraint with no labelSelector silently matches nothing.
          grep -q 'labelSelector' /tmp/ha.yaml
          ! grep -q 'type: Recreate' /tmp/ha.yaml
      - name: mounts no service account token
        run: |
          helm template parley deploy/charts/parley \
            --set database.existingSecret=x > /tmp/sa.yaml
          # Twice: once on the ServiceAccount, once on the pod spec. The
          # pod-level field is the one that wins, so one hit is not enough.
          test "$(grep -c 'automountServiceAccountToken: false' /tmp/sa.yaml)" = 2

      - name: refuses proxy trust with no CIDR allowlist
        run: |
          # The app refuses to start this way, so the chart must refuse to
          # render it: otherwise the failure mode is a CrashLoopBackOff after
          # a successful upgrade.
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set trustProxyHeaders=true 2>/dev/null
          helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set trustProxyHeaders=true \
            --set trustedProxyCIDRs=10.0.0.0/8 >/dev/null
      - name: refuses ingress TLS with an http baseURL
        run: |
          ! helm template parley deploy/charts/parley \
            --set database.existingSecret=x --set ingress.enabled=true \
            --set 'ingress.tls[0].secretName=t' \
            --set baseURL=http://parley.example.com 2>/dev/null

      # The release job pushes to an OCI ref built from the repo owner, which is
      # spelled Lets-Parley — mixed case is an invalid reference and the push
      # fails before it reaches the network. That job only runs on a tag, so the
      # lowercasing logic is exercised here instead of being discovered at
      # release time.
      - name: computes a valid lowercase OCI owner
        run: |
          norm() { echo "$1" | tr '[:upper:]' '[:lower:]'; }
          valid() { echo "$1" | grep -qE '^[a-z0-9]+([._-][a-z0-9]+)*$'; }
          test "$(norm Lets-Parley)" = lets-parley
          valid "$(norm Lets-Parley)"
          # The grammar check must reject what OCI actually rejects, rather than
          # leaning on GitHub's username rules to keep bad input away.
          for bad in "." "-x" "x-" "a/b" "A" ""; do
            ! valid "$bad" || { echo "accepted invalid owner: '$bad'"; exit 1; }
          done

      # The chart and the hand-written manifest must not drift apart on the
      # settings that are load-bearing for security and for staying up.
      - name: matches deploy/k8s/deployment.yaml on the settings that matter
        run: |
          helm template parley deploy/charts/parley \
            --set database.existingSecret=parley --set image.tag=0.2.1 > /tmp/def.yaml
          for want in 'type: RollingUpdate' 'terminationGracePeriodSeconds: 30' \
                      'runAsNonRoot: true' 'allowPrivilegeEscalation: false' \
                      'readOnlyRootFilesystem: true' 'failureThreshold: 12' \
                      'path: /healthz' 'path: /readyz' 'cpu: 50m' 'memory: 64Mi'; do
            grep -q "$want" /tmp/def.yaml || { echo "chart lost: $want"; exit 1; }
            # Both files, or this checks nothing: the whole point is drift
            # between the chart and the hand-written manifest, and greping only
            # the chart's own output could never catch the manifest changing.
            grep -q "$want" deploy/k8s/deployment.yaml \
              || { echo "manifest lost: $want"; exit 1; }
          done
          # replicas is deliberately *not* on that list: the chart defaults to 1
          # and the manifest is a standalone example, so they are allowed to
          # differ. Everything above is a security or stay-up setting where they
          # are not.

  # main's ruleset requires exactly one check from this workflow. Adding a job
  # above means adding it to `needs` here, and nothing else.

  gate:
    name: required / gate
    if: always()
    needs: [go, web, site, dependency-review, dco, docker, container-scan, chart, buildx-arg-passthrough]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        run: |
          test "${{ needs.go.result }}" = success
          test "${{ needs.web.result }}" = success
          test "${{ needs.site.result }}" = success
          test "${{ needs.dependency-review.result }}" = success
          test "${{ needs.dco.result }}" = success
          test "${{ needs.docker.result }}" = success
          test "${{ needs.container-scan.result }}" = success
          test "${{ needs.buildx-arg-passthrough.result }}" = success
          test "${{ needs.chart.result }}" = success
