# The one check main's ruleset requires. Job names change as CI grows; this
# name does not, so the protection rule never has to be edited again. Called
# from ci.yml as the `required` job, which is what makes the check report as
# `required / gate`.
name: gate
on:
  workflow_call:
    inputs:
      results:
        description: needs context of every job the gate covers, as JSON
        required: true
        type: string

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # `needs` skips a dependent job when a dependency fails, so the gate has
      # to inspect the results itself rather than merely depending on them —
      # a skipped gate would otherwise read as "not failed" to the ruleset.
      - name: every covered job succeeded
        env:
          RESULTS: ${{ inputs.results }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -q '"result": *"failure"\|"result": *"cancelled"\|"result": *"skipped"' \
            && { echo "a covered job did not succeed"; exit 1; }
          exit 0
