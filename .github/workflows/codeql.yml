# Static analysis for both halves of the codebase in one job: the required
# check is named `analyze`, and a language matrix would split it into
# `analyze (go)` and `analyze (javascript-typescript)` instead.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  # `analyze` is a required check on main, so it has to report on the
  # merge queue's speculative commit or the queue never dequeues.
  merge_group:
  schedule:
    # Advisories land against code that has not changed, so a weekly run
    # catches what a push-triggered scan never would.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: go,javascript-typescript
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build
      - name: Build Go application
        run: go build ./...
      - uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
