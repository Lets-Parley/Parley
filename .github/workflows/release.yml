name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # `latest` is not listed: flavor latest=auto (the default) already adds
          # it for semver tags and skips it for pre-releases, which is what we
          # want. Listing it explicitly would move `latest` onto a v1.1.0-rc1.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The chart is versioned and published in lockstep with the image, so a chart
  # pulled from the registry always names an image that exists. Both fields are
  # rewritten from the tag rather than kept in sync by hand.
  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: stamp the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: ${VERSION}/" deploy/charts/parley/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" deploy/charts/parley/Chart.yaml
          helm lint deploy/charts/parley --set database.existingSecret=parley
      # OCI references are lowercase-only, and this org is spelled Lets-Parley.
      # The image job gets away with the raw owner because docker/metadata-action
      # lowercases it; helm push does not, and fails the ref parse before it ever
      # reaches the network. Lowercase it here, then assert the result really is
      # a valid ref rather than trusting the tr.
      - name: publish
        # The GitHub expressions go through env rather than straight into the
        # script body: interpolating them inline is the Actions script-injection
        # sink, and it costs nothing to not do it.
        env:
          RAW_OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "$RAW_OWNER" | tr '[:upper:]' '[:lower:]')
          # Actual OCI path-component grammar: starts alphanumeric, separators
          # only between alphanumerics. A looser regex would accept "." or "-x"
          # and lean on GitHub's username rules to save us.
          echo "$OWNER" | grep -qE '^[a-z0-9]+([._-][a-z0-9]+)*$' || {
            echo "computed owner '$OWNER' is not a valid OCI path component"; exit 1; }
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm package deploy/charts/parley --destination /tmp
          helm push /tmp/parley-*.tgz "oci://ghcr.io/${OWNER}/charts"
