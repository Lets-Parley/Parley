name: release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.2@sha256:8870d39b1f18e6421da42aa13e562ce61cc58f230d238f4a905efe959ff8f491

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      major_minor: ${{ steps.release.outputs.major_minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Validate published release
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "$PRERELEASE" = false
          git show-ref --verify --quiet "refs/tags/$TAG"
          release_commit=$(git rev-parse "$TAG^{commit}")
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main
          version=${TAG#v}
          major_minor=${version%.*}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build immutable OCI artifact
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ env.IMAGE }}:${{ needs.validate.outputs.version }}
          outputs: type=oci,dest=/tmp/parley-image.tar
          provenance: mode=max
          sbom: true
      - name: Record expected digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$DIGEST" > /tmp/image-digest.txt
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: oci-archive:/tmp/parley-image.tar
          format: spdx-json
          output-file: /tmp/parley-${{ needs.validate.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ needs.validate.outputs.tag }}
          path: |
            /tmp/parley-image.tar
            /tmp/image-digest.txt
            /tmp/parley-${{ needs.validate.outputs.tag }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image-${{ needs.validate.outputs.tag }}
          path: release
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        id: publish
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          MAJOR_MINOR: ${{ needs.validate.outputs.major_minor }}
        run: |
          set -eu
          docker run --rm \
            --volume "$PWD/release:/release:ro" \
            --volume "$HOME/.docker/config.json:/auth.json:ro" \
            "$SKOPEO_IMAGE" copy --authfile /auth.json --all \
            oci-archive:/release/parley-image.tar "docker://$IMAGE:$VERSION"
          expected=$(cat release/image-digest.txt)
          actual=$(docker run --rm \
            --volume "$HOME/.docker/config.json:/auth.json:ro" \
            "$SKOPEO_IMAGE" inspect --authfile /auth.json \
            --format '{{.Digest}}' "docker://$IMAGE:$VERSION")
          test "$actual" = "$expected"
          docker buildx imagetools create \
            --tag "$IMAGE:$MAJOR_MINOR" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$actual"
          echo "digest=$actual" >> "$GITHUB_OUTPUT"
      - name: Attest published digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  chart:
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Publish chart for the verified image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RAW_OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          helm version
          sed -i "s/^version: .*/version: ${VERSION}/" deploy/charts/parley/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" deploy/charts/parley/Chart.yaml
          helm lint deploy/charts/parley --set database.existingSecret=parley
          owner=$(printf '%s' "$RAW_OWNER" | tr '[:upper:]' '[:lower:]')
          printf '%s\n' "$owner" | grep -Eq '^[a-z0-9]+([._-][a-z0-9]+)*$'
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm package deploy/charts/parley --destination /tmp
          helm push /tmp/parley-*.tgz "oci://ghcr.io/${owner}/charts"

  release-assets:
    needs: [validate, publish, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image-${{ needs.validate.outputs.tag }}
          path: release
      - name: Generate digest-qualified deployment manifests
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: scripts/render-release-manifests.sh "$TAG" "$DIGEST" release
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "release/parley-$TAG-compose.yml" \
            "release/parley-$TAG-kubernetes.yml" \
            "release/parley-$TAG.spdx.json" \
            --clobber
