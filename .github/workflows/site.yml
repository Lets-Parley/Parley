name: site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  # The landing page's star count is read from the GitHub API at build time, so
  # it only moves when the site is rebuilt. Nothing about a star triggers a
  # build, so without this the number is frozen at whatever the last site
  # change happened to see. 06:00 UTC keeps it at most a day stale.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # A broken substitution doesn't fail the build, it just ships the raw
      # token. Match any %TOKEN%, not only %VERSION%: a placeholder misspelled
      # in a page survives substitution, and a grep for the correct spelling
      # would pass right over it.
      - name: Fail on an unsubstituted placeholder
        run: |
          if grep -rlIE --include='*.html' '%[A-Z_]+%' dist; then
            echo "::error::placeholder token leaked into the built site"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Tell IndexNow (Bing, Yandex, Seznam, Naver, ...) which pages a push just
  # changed, so they are recrawled in hours rather than whenever. Push only:
  # the daily star-count rebuild changes no page worth resubmitting, a pull
  # request never deploys, and a manual dispatch has no diff to compute. The
  # key file it names is site/public/<key>.txt, served at the site root.
  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A search-engine ping is advisory. It must never mark a deploy red.
    continue-on-error: true
    env:
      KEY: f3ed8476414a4e94a2934cdfcf4ecf13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so github.event.before is present to diff
          # against however many commits the push carried.
          fetch-depth: 0
      - name: Submit changed pages to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The live sitemap is the deployed one; the build artifact is a
          # Pages tarball this job cannot read.
          curl -fsS --retry 3 https://www.letsparley.io/sitemap-0.xml -o sitemap.xml
          site/scripts/indexnow-urls.sh "$BEFORE" "$AFTER" sitemap.xml > urls.txt
          echo "submitting $(wc -l < urls.txt) URL(s):"; cat urls.txt
          if [ ! -s urls.txt ]; then echo "no page changed"; exit 0; fi
          jq -Rn --arg key "$KEY" '{
            host: "www.letsparley.io",
            key: $key,
            keyLocation: "https://www.letsparley.io/\($key).txt",
            urlList: [inputs]
          }' < urls.txt > body.json
          status=$(curl -sS -o resp.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @body.json https://api.indexnow.org/indexnow) || status=000
          echo "IndexNow answered HTTP $status"; cat resp.txt 2>/dev/null || true
          case "$status" in
            200|202) ;;
            *) echo "::warning::IndexNow submission answered HTTP $status" ;;
          esac
