# The docs site is a public web page built from npm packages, and Astro's
# security fixes land in minor releases — Astro 5 shipped an unpatched XSS in
# `define:vars` that was only resolved by moving to 7. Updates arrive here as
# pull requests rather than being noticed the next time somebody happens to run
# `npm audit` by hand.
#
# Go modules and web/ are not covered: they are updated deliberately, alongside
# the tests that prove the upgrade.
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
