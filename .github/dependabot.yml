version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-dependencies:
        patterns: ["*"]

  # A SHA pin never floats, so a security fix in an action would otherwise sit
  # unnoticed forever. Dependabot rewrites the pin and the tag comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns: ["*"]

  # `docker` above only watches Dockerfiles — it does not see the `image:`
  # lines in docker-compose.yml. `docker-compose` is Dependabot's separate
  # ecosystem for exactly that (GA since 2024), and is what keeps the
  # digest-pinned db image here in step with the one Dockerfile builds.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
